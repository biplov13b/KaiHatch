<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Top Archive Bar (Left solid, right tail dashed/shrinking) -->
  <rect x="8" y="10" width="28" height="16" rx="4" fill="#E2EDF5" stroke="#3B6E8C" stroke-width="3"/>
  <line x1="22" y1="10" x2="22" y2="26" stroke="#3B6E8C" stroke-width="2.5"/>
  <!-- Shrinking Tail Segment -->
  <rect x="38" y="10" width="18" height="16" rx="4" fill="#F0FDFA" stroke="#0D9488" stroke-width="2.5" stroke-dasharray="4 3"/>
  <!-- Leftward shrink arrow inside tail -->
  <path d="M51 18H42M42 18L46 14M42 18L46 22" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Downward extraction arrow -->
  <path d="M24 30V42M24 42L19 37M24 42L29 37" stroke="#0D9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Extracted file block at bottom -->
  <rect x="14" y="45" width="36" height="11" rx="3.5" fill="#CCFBF1" stroke="#0F766E" stroke-width="3"/>
</svg>
