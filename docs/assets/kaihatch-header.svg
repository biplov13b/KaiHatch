    <text x="24" y="106" fill="#0F766E" font-family="JetBrains Mono, DejaVu Sans Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600">VERIFIED EXTRACTED FILES</text>
    <rect x="24" y="116" width="124" height="32" rx="6" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
    <path d="M38 132L43 137L52 127" stroke="#0F766E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="60" y="129" width="68" height="6" rx="3" fill="#0F766E"/>

    <rect x="156" y="116" width="124" height="32" rx="6" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
    <path d="M170 132L175 137L184 127" stroke="#0F766E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="192" y="129" width="68" height="6" rx="3" fill="#0F766E"/>
