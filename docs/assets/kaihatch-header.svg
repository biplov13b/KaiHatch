    <rect x="212" y="46" width="88" height="32" rx="6" fill="#F0FDFA" stroke="#0D9488" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M272 62H238M238 62L246 55M238 62L246 69" stroke="#0F766E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="306" y="46" width="118" height="32" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="365" y="67" text-anchor="middle" fill="#64748B" font-family="JetBrains Mono, DejaVu Sans Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600">RECLAIMED</text>

