<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" fill="none">
  <rect width="1200" height="280" rx="16" fill="#F8FAFC"/>
  <rect x="1.5" y="1.5" width="1197" height="277" rx="14.5" stroke="#CBD5E1" stroke-width="3"/>

  <!-- Left Wordmark & Tagline (No invented app logo, clean typographic identity) -->
  <text x="72" y="132" fill="#0F172A" font-family="Liberation Sans, DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.2">KaiHatch</text>
  <text x="72" y="184" fill="#0F766E" font-family="Liberation Sans, DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="600">Extract more. Use less space.</text>
  <text x="72" y="224" fill="#64748B" font-family="JetBrains Mono, DejaVu Sans Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="500">Progressive in-place archive extractor for Android</text>

  <!-- Right Subtle Archive / Storage Motif -->
  <g transform="translate(680, 56)">
    <rect x="0" y="0" width="448" height="168" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    
