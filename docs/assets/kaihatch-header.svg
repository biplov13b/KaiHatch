    <text x="24" y="34" fill="#64748B" font-family="JetBrains Mono, DejaVu Sans Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600">ARCHIVE TAIL TRUNCATION</text>
    <rect x="24" y="46" width="88" height="32" rx="6" fill="#3B6E8C"/>
